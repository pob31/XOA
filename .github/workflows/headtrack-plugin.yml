name: Head-tracker plugin

# Compile-check the webcam head-tracker plugin (tools/headtrack) on all three
# desktop OSes.
#
# This is a SEPARATE workflow, path-filtered, rather than three more steps in
# ci.yml, because the plugin is built out of tree against OpenCV: installing
# that dependency dominates the job (it roughly doubled the macOS run) and was
# being paid on every push, including ones that cannot affect the plugin.
#
# Path filtering is SOUND here, not just a speed hack: the plugin's compile
# inputs are a closed set. It includes its own sources plus one header — the
# C ABI in spatcore/binaural/plugin — and nothing from the app. A submodule
# bump shows up as a change to the `spatcore` gitlink, which is listed below,
# so an ABI edit still triggers a rebuild.

on:
  push:
    branches: [main]
    paths:
      - 'tools/headtrack/**'
      - 'spatcore'
      - '.github/workflows/headtrack-plugin.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/headtrack/**'
      - 'spatcore'
      - '.github/workflows/headtrack-plugin.yml'
  workflow_dispatch:

concurrency:
  group: headtrack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: plugin (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache OpenCV prebuilt
        uses: actions/cache@v4
        with:
          path: tools/headtrack/.opencv
          key: opencv-win-4.10.0
      # Release even in a Debug CI: the plugin ships Release regardless of the
      # app config (it crosses a C ABI, so no shared CRT state).
      - name: Build plugin
        shell: pwsh
        run: tools\headtrack\build-headtrack-plugin.ps1 -Config Release

  macos:
    name: plugin (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install OpenCV
        run: brew install opencv
      - name: Build plugin
        run: bash tools/headtrack/build-headtrack-plugin.sh Release

  linux:
    name: plugin (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev
      - name: Build plugin
        run: bash tools/headtrack/build-headtrack-plugin.sh Release
